name: CI/CD — worksai-wavecut-studio

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Forbidden Brand & Secret Scan
        run: |
          ! grep -rnI -iE "devon|devin|devinai\.uk" src/ README.md docs/
          ! grep -rnI "BEGIN RSA PRIVATE KEY" .

      - name: TypeScript & ES Module Syntax Verification
        run: |
          node --check src/worker.mjs
          npx --yes --package=typescript@5.8.2 tsc --noEmit

      - name: Run Unit, Multi-Step Tenant CRUD & Export Tests
        run: node --test tests/worker.test.mjs

      - name: Deploy Dedicated Cloudflare Worker (worksai-wavecut-studio)
        if: github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3.109.2 deploy
