name: WorksAI CI/CD — worksai-wavecut-studio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    name: Lint, Brand/Secret Gate, Syntax & Stack Tests (worksai-wavecut-studio)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run ESM Lint & Brand/Secret Hygiene Gate
        run: npm run lint

      - name: Run Syntax & Module Check
        run: npm run typecheck

      - name: Run Unit, Domain Engine, Workers AI & R2 Persistence Tests
        run: npm test

      - name: Post-Deploy Live HTTPS Smoke Check (wavecut.worksai.org)
        run: |
          curl --fail --silent --show-error https://wavecut.worksai.org/api/health | grep '"ok":true'
