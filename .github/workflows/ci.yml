name: WorksAi CI & Release Gate (worksai-03)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax & Lint Check
        run: npm run lint
      - name: Unit, Integration & Security Gate Tests
        run: npm test
